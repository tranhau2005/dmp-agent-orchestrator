[project]
name = "dmp-agent-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<0.120", "uvicorn>=0.30", "sqlalchemy[asyncio]>=2,<3", "alembic>=1.13", "pydantic>=2,<3", "pydantic-settings>=2", "psycopg[binary]>=3", "redis>=5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
